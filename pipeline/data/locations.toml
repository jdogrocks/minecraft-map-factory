# Location Database for Minecraft Map Factory
# Each location defines a bounding box for arnis map generation.
# Tiers: small (< 0.01 deg), medium (0.01-0.05 deg), large (> 0.05 deg)
#
# Marketing will populate this file with new map requests based on demand.
# Format:
#
# [[location]]
# name = "Location Name"
# state = "XX"
# bbox = [min_lat, min_lng, max_lat, max_lng]
# tier = "small" | "medium" | "large"
# tags = ["tag1", "tag2"]
