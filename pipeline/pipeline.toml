# Pipeline configuration
# See pipeline/src/config.rs for all options and defaults.

locations_file = "data/locations.toml"
output_dir = "./output"
arnis_binary = "../target/release/minecraft-map-factory"

[scheduler]
max_concurrency = 2
max_memory_mb = 28000
max_cpu_percent = 0.8

[retry]
max_retries = 3
initial_backoff_secs = 1
max_backoff_secs = 300
shrink_bbox_on_retry = true
bbox_shrink_factor = 0.8

[validation]
min_region_files = 1
min_map_size_bytes = 1024
validate_structure = true
# Cap ground-continuity scan at 16 blocks above default ground_level (64)
# so building interiors above y=80 are not counted as air gaps (MIN-99).
ground_y_scan_cap = 80

[metrics]
summary_interval = 10

[tuning]
enabled = true
min_success_rate = 0.5
memory_threshold = 0.8

# Optional: auto-install each successfully published map to a local Minecraft
# server.  Disabled by default so pipelines without a local server are
# unaffected.  Set auto_install = true to enable.
#
# [installer]
# auto_install = false
# server_dir = "/path/to/your/minecraft-server"   # required when auto_install = true
# script = "../scripts/install-map-local.sh"

# Flags forwarded to the map generator binary for every pipeline invocation.
# Keep this in sync with src/args.rs. Values here are forwarded as
# `--flag=value` (or bare `--terrain`) so the generator's defaults can never
# silently change pipeline output.
[generator]
terrain = true
land_cover = true
interior = true
entities = true
entity_theme = "default"
roof = true
# Explicit ground_level so pipeline output is not sensitive to binary
# default changes. Must stay in sync with validation.ground_y_scan_cap.
ground_level = 64
